[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quant-engine"
version = "0.1.0"
description = "Quantitative Research Engine — backtest overfitting detection, prediction market analysis, options analytics, and information diffusion modeling"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "polars>=1.0",
    "pyarrow>=17.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.100",
    "ruff>=0.7",
    "mypy>=1.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/quant_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py312"
line-length = 99
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "TCH"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
